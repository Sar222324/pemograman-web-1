        <main class="content-area">
            <h2>Kategori Usia Anda</h2>

            <div class="age-card">
                <script>
                     var inputUsia = prompt("Masukkan Usia anda", "");

                    if (inputUsia !== null) {
                        var usia = Number(inputUsia);

                        while (isNaN(usia) || usia <= 0 || inputUsia.trim() === "") {
                        alert("Usia tidak valid! Masukkan angka lebih dari 0.");
                        inputUsia = prompt("Masukkan Usia anda kembali:", "");

                        if (inputUsia === null) {
                        break;
                        }
                         usia = Number(inputUsia);
                        }

                    if (inputUsia !== null) {
                        var keterangan = "";

                        if (usia > 65) {
                            keterangan = "Manula";
                        } else if (usia > 50) {
                            keterangan = "Orang Tua";
                        } else if (usia > 20) {
                            keterangan = "Dewasa";
                        } else if (usia > 12) {
                            keterangan = "Remaja";
                        } else if (usia > 5) {
                            keterangan = "Anak-Anak";
                        } else {
                            keterangan = "Balita";
                        }

                        document.write("<h3 class='age-result'>Usia Anda: " + usia + " tahun</h3>");
                        document.write("<p class='age-category'>Kategori: <span>" + keterangan + "</span></p>");
                        window.alert("Usia Anda " + usia + " tahun, tergolong: " + keterangan);
                    } else {
                        document.write("<p>Proses dibatalkan oleh pengguna.</p>");
                    }
                    } else {
                        document.write("<p>Proses dibatalkan oleh pengguna.</p>");
                    }
                </script>

                <button class="btn-reload" onclick="location.reload()">Cek Usia Lagi</button>
            </div>
        </main>
