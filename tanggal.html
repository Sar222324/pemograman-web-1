            </ul>
        </aside>

        <main class="content-area">
            <h2>Informasi Waktu Saat Ini</h2>

            <div class="date-card">
                <script>
                    var waktu = new Date();

                    var jam = waktu.getHours();
                    var menit = waktu.getMinutes();
                    var detik = waktu.getSeconds();

                    var tgl = waktu.getDate();
                    var bln = waktu.getMonth();
                    var thn = waktu.getFullYear();
                    var hr = waktu.getDay();

                    var namaHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
                    var namaBulan = [
                        "Januari", "Februari", "Maret", "April", "Mei", "Juni",
                        "Juli", "Agustus", "September", "Oktober", "November", "Desember"
                    ];

                    var salam = "";
                    if (jam >= 0 && jam < 11) {
                        salam = "Selamat Pagi";
                    } else if (jam >= 11 && jam <= 14) {
                        salam = "Selamat Siang";
                    } else if (jam > 14 && jam <= 18) {
                        salam = "Selamat Sore";
                    } else {
                        salam = "Selamat Istirahat";
                    }

                    var jamFormat = (jam < 10 ? "0" : "") + jam;
                    var menitFormat = (menit < 10 ? "0" : "") + menit;
                    var detikFormat = (detik < 10 ? "0" : "") + detik;

                    document.write("<div class='time-display'>" + jamFormat + ":" + menitFormat + ":" + detikFormat + " WIB</div>");

                    document.write("<h3 class='date-display'>" + namaHari[hr] + ", " + tgl + " " + namaBulan[bln] + " " + thn + "</h3>");

                    document.write("<div class='salam-badge'>" + salam + "</div>");
                </script>
            </div>
        </main>

    </div>

</body>
